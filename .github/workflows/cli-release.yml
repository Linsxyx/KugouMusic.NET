name: Build and Publish CLI (NativeAOT + npm)

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'npm package version when triggered manually (e.g. 0.1.1)'
        required: false
        default: '0.1.1'

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: '1'

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: win-x64
          - os: windows-latest
            rid: win-arm64
            name: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
            name: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            name: linux-arm64
          - os: macos-latest
            rid: osx-arm64
            name: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
            name: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT prerequisites (Linux)
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish KaMusic.Cli (NativeAOT)
        shell: bash
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#cli-v}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          if [[ -z "$CLEAN_VERSION" || "$CLEAN_VERSION" == "$GITHUB_REF_NAME" ]]; then
            CLEAN_VERSION="${{ inputs.version || '0.1.1' }}"
          fi

          dotnet publish ./src/Apps/KaMusic.Cli/KaMusic.Cli.csproj \
            -c Release \
            -f net10.0 \
            "-p:Version=$CLEAN_VERSION" \
            -r "${{ matrix.rid }}" \
            "-p:RuntimeIdentifier=${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:IlcSingleThreaded=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "./publish/KaMusic.Cli-${{ matrix.rid }}"

      - name: Strip debug symbols and XML docs
        shell: bash
        run: |
          find "./publish/KaMusic.Cli-${{ matrix.rid }}" -type d -name '*.dSYM' -prune -exec rm -rf {} +
          find "./publish/KaMusic.Cli-${{ matrix.rid }}" -type f \( -name '*.pdb' -o -name '*.dbg' -o -name '*.xml' \) -delete
          ls -lh "./publish/KaMusic.Cli-${{ matrix.rid }}"

      - name: Run NativeAOT self-test
        if: matrix.rid != 'win-arm64'
        shell: bash
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            "./publish/KaMusic.Cli-${{ matrix.rid }}/KaMusic.Cli.exe" --self-test
          else
            chmod +x "./publish/KaMusic.Cli-${{ matrix.rid }}/KaMusic.Cli"
            "./publish/KaMusic.Cli-${{ matrix.rid }}/KaMusic.Cli" --self-test
          fi

      - name: Package Archive
        shell: bash
        run: |
          mkdir -p ./dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a -tzip "./dist/KaMusic.Cli-${{ matrix.rid }}.zip" "./publish/KaMusic.Cli-${{ matrix.rid }}/*"
          else
            chmod +x "./publish/KaMusic.Cli-${{ matrix.rid }}/KaMusic.Cli"
            tar -C "./publish" -czf "./dist/KaMusic.Cli-${{ matrix.rid }}.tar.gz" "KaMusic.Cli-${{ matrix.rid }}"
            (cd "./publish" && zip -r "../dist/KaMusic.Cli-${{ matrix.rid }}.zip" "KaMusic.Cli-${{ matrix.rid }}")
          fi
          ls -lh ./dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-releases-${{ matrix.name }}
          path: ./dist/*

  publish-npm:
    needs:
      - build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download All CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all_cli_artifacts

      - name: Assemble and Publish npm Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::warning::未配置 secrets.NPM_TOKEN，跳过自动发布到 npm（请在仓库 Settings -> Secrets and variables -> Actions 中添加 NPM_TOKEN）。"
            exit 0
          fi

          CLEAN_VERSION="${GITHUB_REF_NAME#cli-v}"
          CLEAN_VERSION="${CLEAN_VERSION#v}"
          if [[ -z "$CLEAN_VERSION" || "$CLEAN_VERSION" == "$GITHUB_REF_NAME" ]]; then
            CLEAN_VERSION="${{ inputs.version || '0.1.1' }}"
          fi

          node ./.github/scripts/publish-cli-npm.mjs ./all_cli_artifacts "$CLEAN_VERSION"
